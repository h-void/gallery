# ==============================================================================
# Gallery - 漫画与画集媒体库 Docker Compose 部署配置
#
# 【使用说明】
# 1. 写入路径：在下方 volumes 中，将 /volume1/photo 修改为你的实际媒体目录绝对路径。
# 2. 选择运行模式：在下方 services 中，默认启用 CPU 模式（无需显卡，直接可用）。
#    - 若使用 Intel 核显：注释掉 CPU 模式，取消注释下面的 Intel 核显模式。
#    - 若使用 NVIDIA 显卡：注释掉 CPU 模式，取消注释下面的 NVIDIA 显卡模式。
# 3. 其它参数修改（端口、扫描周期、备份策略、AI 识别等）：全部在 .env 中修改。
# ==============================================================================

name: gallery

x-gallery-base: &gallery-base
  image: crpi-hwq9kgccbg8v0l26.cn-hangzhou.personal.cr.aliyuncs.com/hczhr/gallery:stable
  restart: unless-stopped
  ports:
    - "${GALLERY_PORT:-8899}:8899"
  read_only: true
  tmpfs:
    - /tmp:size=512m,mode=1777
  volumes:
    # ── 1. 媒体路径（冒号左侧替换为实际路径；只读挂载 :ro 保护原文件安全）──
    - "${GALLERY_MEDIA_DIR:-/volume1/photo}:/media:ro"
    # 多目录挂载示例（如有更多目录，取消注释并修改路径，或在 .env 中配置）：
    # - "${GALLERY_MEDIA_DIR2:-/volume2/art}:/media2:ro"
    # - "${GALLERY_MEDIA_DIR3:-/volume3/extra}:/media3:ro"
    - gallery-storage:/gallery
  environment:
    # 高级参数全部可在 .env 中覆盖，此处内置默认值保障开箱即用
    CHARACTER_RECOGNITION_ENABLED: "${CHARACTER_RECOGNITION_ENABLED:-1}"
    CHARACTER_ALLOW_CPU_FALLBACK: "${CHARACTER_ALLOW_CPU_FALLBACK:-1}"
    ONNXRUNTIME_AUTO_DOWNLOAD: "${ONNXRUNTIME_AUTO_DOWNLOAD:-1}"
    CHARACTER_MODEL_IDLE_TIMEOUT_SECONDS: "${CHARACTER_MODEL_IDLE_TIMEOUT_SECONDS:-600}"
    SCAN_INTERVAL: "${SCAN_INTERVAL:-21600}"
    HASH_INTERVAL: "${HASH_INTERVAL:-30}"
    DB_BACKUP_INTERVAL: "${DB_BACKUP_INTERVAL:-43200}"
    DB_BACKUP_RETENTION: "${DB_BACKUP_RETENTION:-8}"

# ── 2. 运行模式选择（默认使用 CPU；如需核显或显卡，启用对应段落并注释 CPU 模式）──
services:
  # 模式 1：CPU 模式（默认直接可用，无需显卡，兼容所有 NAS 与电脑）
  gallery:
    <<: *gallery-base
    environment:
      CHARACTER_RECOGNITION_PROVIDER: "${CHARACTER_RECOGNITION_PROVIDER:-cpu}"

  # 模式 2：Intel 核显模式（原生 Linux / NAS 核显直通；启用时取消注释本段，并注释上方 CPU 模式）
  # gallery:
  #   <<: *gallery-base
  #   environment:
  #     CHARACTER_RECOGNITION_PROVIDER: "${CHARACTER_RECOGNITION_PROVIDER:-openvino}"
  #   devices:
  #     - /dev/dri:/dev/dri
  #   group_add:
  #     - ${GALLERY_RENDER_GID:-109}
  #     - ${GALLERY_VIDEO_GID:-44}

  # 模式 3：NVIDIA 显卡模式（需安装 NVIDIA 驱动及 Container Toolkit；启用时取消注释本段，并注释上方 CPU 模式）
  # gallery:
  #   <<: *gallery-base
  #   image: crpi-hwq9kgccbg8v0l26.cn-hangzhou.personal.cr.aliyuncs.com/hczhr/gallery:stable-cuda
  #   environment:
  #     CHARACTER_RECOGNITION_PROVIDER: "${CHARACTER_RECOGNITION_PROVIDER:-cuda}"
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]

volumes:
  gallery-storage:
