name: gallery

services:
  gallery:
    build: .
    image: crpi-hwq9kgccbg8v0l26.cn-hangzhou.personal.cr.aliyuncs.com/hczhr/gallery:stable
    restart: unless-stopped
    ports:
      - "${GALLERY_PORT:-8899}:8899"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    volumes:
      # 改成你的真实媒体目录（Windows 用 /d/Pictures 这种形式，或 C:\ 绝对路径）
      - "${GALLERY_MEDIA_DIR:-./media}:/media:ro"
      - gallery-storage:/gallery
    environment:
      PICTURES_ROOT_LABELS: "${GALLERY_MEDIA_LABEL:-media}"

volumes:
  gallery-storage:
